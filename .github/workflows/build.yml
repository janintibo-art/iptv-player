name: Build APK et EXE

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

# Necessaire pour creer une Release et y attacher les fichiers.
permissions:
  contents: write

jobs:
  android:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generer la plateforme Android
        run: flutter create --org com.exemple --project-name iptv_player --platforms=android .

      - name: Ajouter la permission INTERNET
        run: python3 tool/patch_android.py

      - run: flutter pub get

      - name: Generer les icones
        run: dart run flutter_launcher_icons

      # Un APK par architecture : environ 3 fois plus leger qu un APK universel.
      - name: Compiler les APK
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: iptv-player-android-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Publier dans la Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true

  windows:
    name: EXE Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generer la plateforme Windows
        run: flutter create --org com.exemple --project-name iptv_player --platforms=windows .

      - run: flutter pub get

      - name: Desactiver les icones Android sur ce runner
        shell: bash
        run: sed -i 's/^  android: true/  android: false/' pubspec.yaml

      - name: Generer les icones
        run: dart run flutter_launcher_icons

      - run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: iptv-player-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

      # Pour la Release on livre une archive unique, DLL comprises.
      - name: Archiver le dossier Windows
        if: startsWith(github.ref, 'refs/tags/')
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath iptv-player-windows.zip
        shell: pwsh

      - name: Publier dans la Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: iptv-player-windows.zip
          generate_release_notes: true
